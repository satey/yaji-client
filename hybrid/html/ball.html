			.ballActive {
				box-shadow: 0 0 0.5rem #FE4373 !important;
				animation: animat 2s linear infinite;
			}

			.ballActive::before {
				content: '';
				position: absolute;
				top: 0.06rem;
				left: 0.06rem;
				right: 0.06rem;
				bottom: 0.06rem;
				/*我们没有给定宽高而是通过 上下左右边距6来控制大小*/
				/*和背景一样的颜色*/
				border-radius: 50%;
				z-index: 999;
				/*控制该层在最上方*/
			}

			.ballActive::after {
				content: '';
				position: absolute;
				top: 0px;
				left: 0px;
				right: 0px;
				bottom: 0px;
				background: linear-gradient(45deg, transparent, transparent 40%, #e5f403);
				border-radius: 50%;
				z-index: 1;
				filter: blur(0.3rem);
				/*高斯模糊处理*/
			}

			@keyframes animat {
				0% {
					transform: rotate(0deg);
					filter: hue-rotate(0deg);
				}

				100% {
					transform: rotate(360deg);
					filter: hue-rotate(360deg);
				}
			}
